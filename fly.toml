app = "traick"
primary_region = "cdg"

[build]

[env]
  DB_PATH = "/data/traick.db"
  PROCESS_INTERVAL_MINUTES = "5"
  REMINDER_INTERVAL_MINUTES = "15"

[mounts]
  source = "traick_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    path = "/health"
