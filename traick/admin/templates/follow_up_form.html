{% extends "base.html" %}
{% set active = "follow_ups" %}
{% block title %}{% if follow_up %}Edit{% else %}New{% endif %} Follow Up — Traick{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{% if follow_up %}Edit{% else %}New{% endif %} Follow Up</h1>
</div>
<div class="card card-body form-card">
    <form method="post">
        <div class="form-group">
            <label>Project</label>
            <select name="project_id" id="project_select" required>
                {% for p in projects %}
                <option value="{{ p['id'] }}" {% if follow_up and follow_up['project_id'] == p['id'] %}selected{% elif not follow_up and preselect_project_id == p['id'] %}selected{% endif %}>{{ p['name'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Action Item</label>
            <select name="action_item_id" id="action_item_select" required>
                {% for ai in action_items %}
                <option value="{{ ai['id'] }}" data-project-id="{{ ai['project_id'] }}" {% if follow_up and follow_up['action_item_id'] == ai['id'] %}selected{% endif %}>{{ ai['description'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Message</label>
            <input type="text" name="message" value="{{ follow_up['message'] if follow_up else '' }}" required>
        </div>
        <div class="form-group">
            <label>Scheduled At</label>
            <input type="datetime-local" name="scheduled_at" {% if follow_up %}data-utc-value="{{ follow_up['scheduled_at'] }}"{% endif %} required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/admin/follow_ups" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
<script>
function filterActionItems() {
    const projectId = document.getElementById('project_select').value;
    const select = document.getElementById('action_item_select');
    const options = select.querySelectorAll('option');
    let firstVisible = null;

    options.forEach(opt => {
        const matches = opt.dataset.projectId === projectId;
        opt.hidden = !matches;
        if (matches && !firstVisible) firstVisible = opt;
    });

    if (select.selectedOptions[0] && select.selectedOptions[0].hidden) {
        select.value = firstVisible ? firstVisible.value : '';
    }
}

document.getElementById('project_select').addEventListener('change', filterActionItems);
filterActionItems();
</script>
{% endblock %}
