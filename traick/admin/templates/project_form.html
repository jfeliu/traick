{% extends "base.html" %}
{% set active = "projects" %}
{% block title %}{% if project %}Edit{% else %}New{% endif %} Project — Traick{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{% if project %}Edit{% else %}New{% endif %} Project</h1>
</div>
<div class="card card-body form-card">
    <form method="post">
        <div class="form-group">
            <label>Owner Number</label>
            <input type="text" name="owner_number" value="{{ project['owner_number'] if project else '' }}" required>
        </div>
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ project['name'] if project else '' }}" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" name="description" value="{{ project['description'] if project else '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/admin/projects" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
