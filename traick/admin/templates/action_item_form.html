{% extends "base.html" %}
{% set active = "action_items" %}
{% block title %}{% if action_item %}Edit{% else %}New{% endif %} Action Item — Traick{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{% if action_item %}Edit{% else %}New{% endif %} Action Item</h1>
</div>
<div class="card card-body form-card">
    <form method="post">
        <div class="form-group">
            <label>Project</label>
            <select name="project_id" required>
                {% for p in projects %}
                <option value="{{ p['id'] }}" {% if action_item and action_item['project_id'] == p['id'] %}selected{% endif %}>{{ p['name'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" name="description" value="{{ action_item['description'] if action_item else '' }}" required>
        </div>
        <div class="form-group">
            <label>Deadline</label>
            <input type="date" name="deadline" value="{{ action_item['deadline'] if action_item else '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/admin/action_items" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
